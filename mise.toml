# One toolchain for this repository: `mise install`, then `mise run check`.
[tools]
bun = "1.4.4"
rumdl = "0.3.4"
shfmt = "3.14.1"

[tasks.check]
description = "Check the format of Markdown, shell code blocks and shell scripts"
run = ["rumdl check .", "shfmt -i 2 -ci -bn -d ."]

[tasks.fix]
description = "Format Markdown, shell code blocks and shell scripts"
run = ["rumdl fmt .", "shfmt -i 2 -ci -bn -w ."]
