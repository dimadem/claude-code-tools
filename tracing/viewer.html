<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trace Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.3/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff@9.0.0/dist/diff.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 13px;
        background: #0d0d0d;
        color: #c8c8c8;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Toolbar ─────────────────────────────────────────────── */
      #toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 7px 14px;
        background: #111;
        border-bottom: 1px solid #1e1e1e;
        flex-shrink: 0;
      }

      #btn-open {
        background: #192a3e;
        color: #5fa8d3;
        border: 1px solid #1e3d5a;
        font-family: inherit;
        font-size: 11px;
        padding: 4px 12px;
        cursor: pointer;
        letter-spacing: 0.04em;
        transition:
          background 0.12s,
          border-color 0.12s;
        &:hover {
          background: #1e3550;
          border-color: #2a5580;
        }
      }

      #status {
        color: #555;
        font-size: 11px;
        margin-left: 2px;
      }

      .match-nav {
        background: #0f0f0f;
        border: 1px solid #1e1e1e;
        color: #888;
        font-family: inherit;
        font-size: 13px;
        line-height: 1;
        padding: 3px 8px;
        cursor: pointer;
        transition:
          color 0.12s,
          border-color 0.12s;
        &:hover:not(:disabled) {
          color: #ff6060;
          border-color: #5a2020;
        }
        &:disabled {
          opacity: 0.25;
          cursor: default;
        }
      }
      #match-prev {
        margin-left: auto;
      }
      #match-count {
        color: #666;
        font-size: 10px;
        min-width: 38px;
        text-align: center;
        white-space: nowrap;
      }

      #search {
        background: #0f0f0f;
        border: 1px solid #1e1e1e;
        color: #c8c8c8;
        font-family: inherit;
        font-size: 11px;
        padding: 4px 10px;
        width: 220px;
        outline: none;
        transition: border-color 0.12s;
        &::placeholder {
          color: #444;
        }
        &:focus {
          border-color: #2a5580;
        }
        &:disabled {
          opacity: 0.4;
          cursor: not-allowed;
        }
      }

      /* ── Tab Rail ────────────────────────────────────────────── */
      #tab-rail {
        display: flex;
        align-items: stretch;
        background: #0f0f0f;
        border-bottom: 1px solid #1e1e1e;
        flex-shrink: 0;
        height: 40px;
        overflow: hidden;
      }

      .rail-arrow {
        width: 26px;
        background: #0f0f0f;
        border: none;
        border-right: 1px solid #1a1a1a;
        color: #2a2a2a;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.12s,
          background 0.12s;
        padding-bottom: 1px;
        &:hover {
          color: #666;
          background: #141414;
        }
        &:last-child {
          border-right: none;
          border-left: 1px solid #1a1a1a;
        }
        &:disabled {
          opacity: 0.2;
          cursor: default;
          pointer-events: none;
        }
      }

      #tab-strip {
        display: flex;
        align-items: stretch;
        overflow-x: auto;
        flex: 1;
        scrollbar-width: none;
        scroll-behavior: smooth;
        &::-webkit-scrollbar {
          display: none;
        }
      }

      /* Date separator */
      .tab-date {
        display: flex;
        align-items: center;
        padding: 0 14px;
        flex-shrink: 0;
        border-right: 1px solid #252525;
        position: relative;
        background: #141414;
        border-left: 2px solid #3b82f6;
      }

      .tab-date-label {
        font-size: 12px;
        color: #e0e0e0;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
        font-weight: 600;
      }

      /* Individual tab */
      .tab {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 13px;
        border-right: 1px solid #171717;
        cursor: pointer;
        flex-shrink: 0;
        position: relative;
        background: transparent;
        min-width: 108px;
        max-width: 160px;
        transition: background 0.1s;
        user-select: none;

        &:hover {
          background: #141414;
        }
        &:focus-visible {
          outline: none;
          background: #141414;
          &::after {
            background: #2a5580;
          }
        }

        &::after {
          content: "";
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          height: 2px;
          background: transparent;
          transition: background 0.15s;
        }

        &.active {
          background: #0d0d0d;
          &::after {
            background: #3b82f6;
          }
          & .tab-time {
            color: #5fa8d3;
          }
          & .tab-id {
            color: #333;
          }
        }
      }

      .tab-time {
        font-size: 11px;
        color: #555;
        white-space: nowrap;
        line-height: 1.3;
        transition: color 0.12s;
      }

      .tab-id {
        font-size: 9.5px;
        color: #252525;
        white-space: nowrap;
        letter-spacing: 0.04em;
        line-height: 1.3;
        transition: color 0.12s;
        cursor: pointer;
        &:hover {
          color: #555;
        }
      }

      /* ── Content ─────────────────────────────────────────────── */
      #table-wrap {
        flex: 1;
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th.col-time {
        width: 70px;
      }
      th.col-type {
        width: 90px;
      }

      thead th {
        position: sticky;
        top: 0;
        background: #0f0f0f;
        border-bottom: 1px solid #1a1a1a;
        padding: 6px 12px;
        text-align: left;
        color: #333;
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      tbody {
        & tr {
          border-bottom: 1px solid #111;
          content-visibility: auto;
          contain-intrinsic-size: auto 50px;
          &:hover {
            background: #0f0f0f;
          }
          &.has-hl {
            background: #2a0a0a;
            box-shadow: inset 3px 0 0 #ff3030;
            &:hover {
              background: #3a0e0e;
            }
            &.is-current-match {
              background: #4a1414;
              box-shadow: inset 3px 0 0 #ff8080;
            }
          }
        }
        & td {
          padding: 7px 12px;
          vertical-align: top;
        }
      }

      mark.hl {
        background: #ff2030;
        color: #fff;
        padding: 0 2px;
        border-radius: 2px;
        font-weight: 600;
      }

      .time {
        color: #333;
        white-space: nowrap;
        font-size: 11px;
        padding-top: 9px;
      }

      .badge {
        display: inline-block;
        padding: 2px 7px;
        font-size: 10px;
        white-space: nowrap;
        font-weight: 600;
        letter-spacing: 0.06em;
        &.b-user {
          background: #0d2a45;
          color: #5fa8d3;
        }
        &.b-assistant {
          background: #172717;
          color: #6dba6d;
        }
        &.b-tool {
          background: #2a2000;
          color: #d4a030;
        }
        &.b-result {
          background: #18182a;
          color: #8080c0;
        }
      }

      .cell {
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .cell-user {
        color: #a8d0f0;
      }
      .cell-assist {
        color: #c0c0c0;
        white-space: normal;
        & p {
          margin: 0.5em 0;
          &:first-child {
            margin-top: 0;
          }
          &:last-child {
            margin-bottom: 0;
          }
        }
        & h1,
        & h2,
        & h3,
        & h4 {
          margin: 0.8em 0 0.4em;
          color: #e0e0e0;
          font-weight: 600;
        }
        & h1 {
          font-size: 16px;
        }
        & h2 {
          font-size: 14px;
        }
        & h3,
        & h4 {
          font-size: 13px;
        }
        & ul,
        & ol {
          margin: 0.4em 0;
          padding-left: 1.6em;
        }
        & li {
          margin: 0.2em 0;
        }
        & code {
          background: #1a1a1a;
          padding: 1px 5px;
          border-radius: 2px;
          font-family: inherit;
          font-size: 12px;
          color: #d4a030;
        }
        & pre {
          background: #0a0a0a;
          border: 1px solid #1e1e1e;
          padding: 8px 12px;
          margin: 0.6em 0;
          overflow-x: auto;
          & code {
            background: transparent;
            padding: 0;
            color: inherit;
          }
        }
        & strong {
          color: #e8e8e8;
          font-weight: 600;
        }
        & a {
          color: #5fa8d3;
        }
        & blockquote {
          border-left: 2px solid #2a5580;
          padding-left: 10px;
          margin: 0.5em 0;
          color: #888;
        }
      }
      .tool-name {
        color: #d4a030;
        font-weight: 600;
      }
      .tool-path {
        color: #888;
        font-size: 11px;
        margin-left: 8px;
      }

      .diff-block {
        margin-top: 4px;
        background: #0a0a0a;
        border: 1px solid #1e1e1e;
        font-size: 12px;
        line-height: 1.5;
        overflow-x: auto;
        & .diff-line {
          padding: 0 10px;
          white-space: pre-wrap;
          word-break: break-word;
        }
        & .diff-add {
          background: #0e2a14;
          color: #80d090;
        }
        & .diff-rm {
          background: #2a0e0e;
          color: #d08080;
        }
        & .diff-ctx {
          color: #555;
        }
      }

      .json-block {
        margin-top: 4px;
        overflow-x: auto;
        & pre {
          margin: 0;
        }
        & code {
          font-family: inherit;
          font-size: 12px;
        }
      }

      .text-block {
        background: #0f0f0f;
        border: 1px solid #1e1e1e;
        padding: 8px 12px;
        margin-top: 4px;
        color: #8888a8;
      }

      details > summary {
        cursor: pointer;
        list-style: none;
        user-select: none;
        padding: 2px 0;
        color: #444;
        &::-webkit-details-marker {
          display: none;
        }
        &::before {
          content: "▾";
          display: inline-block;
          width: 14px;
          transition: transform 0.15s;
        }
      }
      details:not([open]) > summary::before {
        transform: rotate(-90deg);
      }

      #placeholder {
        display: grid;
        place-items: center;
        height: 100%;
        color: #555;
        font-size: 13px;
        & p {
          line-height: 2;
          text-align: center;
        }
        & .hint {
          font-size: 11px;
          color: #2a2a2a;
        }
      }

      .hidden {
        display: none !important;
      }

      body.dragover {
        outline: 2px dashed #3b82f6;
        outline-offset: -6px;
        & #placeholder {
          color: #3b82f6;
          & .hint {
            color: #2a4a7a;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button type="button" id="btn-open">Open tracing folder</button>
      <span id="status">No folder selected</span>
      <button
        type="button"
        class="match-nav"
        id="match-prev"
        title="Previous match (Shift+Enter)"
        disabled
      >
        ‹
      </button>
      <span id="match-count"></span>
      <button
        type="button"
        class="match-nav"
        id="match-next"
        title="Next match (Enter)"
        disabled
      >
        ›
      </button>
      <input
        type="search"
        id="search"
        placeholder="Search sessions…"
        autocomplete="off"
        spellcheck="false"
        disabled
      />
    </div>

    <div id="tab-rail" class="hidden">
      <button
        type="button"
        class="rail-arrow"
        id="tab-prev"
        aria-label="Scroll tabs left"
        title="Scroll left"
      >
        ‹
      </button>
      <div id="tab-strip"></div>
      <button
        type="button"
        class="rail-arrow"
        id="tab-next"
        aria-label="Scroll tabs right"
        title="Scroll right"
      >
        ›
      </button>
    </div>

    <div id="table-wrap">
      <div id="placeholder">
        <p id="placeholder-text"></p>
        <p class="hint">Supports .jsonl session files</p>
      </div>
      <table id="tbl" class="hidden">
        <thead>
          <tr>
            <th class="col-time">Time</th>
            <th class="col-type">Type</th>
            <th>Content</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <template id="row-tpl">
      <tr>
        <td class="time"></td>
        <td><span class="badge"></span></td>
        <td class="cell"></td>
      </tr>
    </template>

    <script>
      const sessions = {};
      const sessionIndex = {};
      let activeId = null;
      let allIds = [];
      let currentTokens = [];
      let currentMatches = [];
      let currentMatchIdx = -1;

      const el = (id) => document.getElementById(id);

      const PLACEHOLDER_DEFAULT =
        "Click <strong>Open tracing folder</strong><br />or drag a <code>tracing/</code> directory here";
      const PLACEHOLDER_NO_MATCH = "No sessions match your search";

      el("placeholder-text").innerHTML = PLACEHOLDER_DEFAULT;

      marked.use({
        gfm: true,
        breaks: true,
        renderer: {
          code({ text, lang }) {
            const language = hljs.getLanguage(lang) ? lang : "plaintext";
            const code = hljs.highlight(text, { language }).value;
            return `<pre><code class="hljs language-${language}">${code}</code></pre>`;
          },
        },
      });

      const BADGE = {
        user: { label: "USER", badgeCls: "b-user", cellCls: "cell-user" },
        assistant: {
          label: "ASSISTANT",
          badgeCls: "b-assistant",
          cellCls: "cell-assist",
        },
        tool: { label: "TOOL CALL", badgeCls: "b-tool", cellCls: "" },
        result: { label: "RESULT", badgeCls: "b-result", cellCls: "" },
      };

      // ── Open button ───────────────────────────────────────────────
      el("btn-open").onclick = async () => {
        try {
          const dir = await window.showDirectoryPicker({ mode: "read" });
          await loadDir(dir);
        } catch (e) {
          if (e.name !== "AbortError") console.error(e);
        }
      };

      // ── Drag & drop ───────────────────────────────────────────────
      let dragDepth = 0;
      document.addEventListener("dragenter", (e) => {
        e.preventDefault();
        if (++dragDepth === 1) document.body.classList.add("dragover");
      });
      document.addEventListener("dragover", (e) => e.preventDefault());
      document.addEventListener("dragleave", () => {
        if (--dragDepth <= 0) {
          dragDepth = 0;
          document.body.classList.remove("dragover");
        }
      });
      document.addEventListener("drop", async (e) => {
        e.preventDefault();
        dragDepth = 0;
        document.body.classList.remove("dragover");
        for (const item of e.dataTransfer.items) {
          const h = await item.getAsFileSystemHandle?.();
          if (h?.kind === "directory") {
            await loadDir(h);
            return;
          }
        }
      });

      // ── Load directory ────────────────────────────────────────────
      async function loadDir(dir) {
        el("status").textContent = "Loading…";
        activeId = null;

        for (const k of Object.keys(sessions)) delete sessions[k];
        for (const k of Object.keys(sessionIndex)) delete sessionIndex[k];
        el("tbody").replaceChildren();
        el("tab-strip").replaceChildren();

        const handles = [];
        for await (const [name, handle] of dir)
          if (handle.kind === "file" && name.endsWith(".jsonl"))
            handles.push([name, handle]);

        await Promise.all(
          handles.map(async ([name, handle]) => {
            const text = await (await handle.getFile()).text();
            sessions[name.replace(/\.jsonl$/, "")] = text
              .trim()
              .split("\n")
              .flatMap((l) => {
                try {
                  return [JSON.parse(l)];
                } catch {
                  return [];
                }
              });
          }),
        );

        const ids = Object.keys(sessions).sort(
          (a, b) => sessionTs(b) - sessionTs(a),
        );
        allIds = ids;
        for (const id of ids) sessionIndex[id] = buildIndex(sessions[id]);

        const search = el("search");
        search.disabled = !ids.length;
        if (!ids.length) {
          el("status").textContent = "No .jsonl files found";
          el("tab-rail").classList.add("hidden");
          el("tbl").classList.add("hidden");
          el("placeholder").classList.remove("hidden");
          return;
        }

        buildTabs(ids);
        applyFilter();
      }

      function buildIndex(rows) {
        const parts = [];
        for (const row of rows) {
          const c = row.message?.content;
          if (typeof c === "string") parts.push(c);
          else if (Array.isArray(c)) {
            for (const b of c) {
              if (b.type === "text" && b.text) parts.push(b.text);
              else if (b.text) parts.push(b.text);
              if (b.type === "tool_use") {
                if (b.name) parts.push(b.name);
                if (b.input) {
                  try {
                    parts.push(JSON.stringify(b.input));
                  } catch {}
                }
              }
            }
          }
          const r = row.toolUseResult;
          if (r) {
            if (typeof r === "string") parts.push(r);
            else {
              if (r.stdout) parts.push(r.stdout);
              if (r.stderr) parts.push(r.stderr);
              if (Array.isArray(r.content))
                for (const x of r.content) if (x.text) parts.push(x.text);
            }
          }
        }
        return parts.join("\n").toLowerCase();
      }

      function sessionTs(id) {
        const first = sessions[id]?.find((r) => r.timestamp);
        const t = first ? new Date(first.timestamp).getTime() : 0;
        return Number.isFinite(t) ? t : 0;
      }

      // ── Tab strip ─────────────────────────────────────────────────
      function buildTabs(ids) {
        const strip = el("tab-strip");
        strip.innerHTML = "";

        let lastDateKey = null;

        for (const id of ids) {
          const ts = sessionTs(id);
          const dateKey = ts
            ? new Date(ts).toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
              })
            : "—";

          // Date separator
          if (dateKey !== lastDateKey) {
            lastDateKey = dateKey;
            const sep = document.createElement("div");
            sep.className = "tab-date";
            sep.innerHTML = `<span class="tab-date-label">${dateKey}</span>`;
            strip.appendChild(sep);
          }

          // Tab
          const tab = document.createElement("div");
          tab.className = "tab";
          tab.dataset.id = id;

          const timeStr = ts
            ? new Date(ts).toLocaleTimeString("en-GB", {
                hour12: false,
                hour: "2-digit",
                minute: "2-digit",
              })
            : "—";

          const shortId = document.createElement("span");
          shortId.className = "tab-id";
          shortId.textContent = id.slice(0, 8);
          shortId.title = "Click to copy filename";
          shortId.onclick = (e) => {
            e.stopPropagation();
            navigator.clipboard.writeText(id + ".jsonl");
            shortId.textContent = "copied!";
            shortId.style.color = "#6dba6d";
            setTimeout(() => {
              shortId.textContent = id.slice(0, 8);
              shortId.style.color = "";
            }, 1200);
          };

          tab.innerHTML = `<span class="tab-time">${timeStr}</span>`;
          tab.appendChild(shortId);
          tab.tabIndex = 0;
          tab.setAttribute("role", "tab");
          tab.onclick = () => selectTab(id);
          tab.onkeydown = (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selectTab(id);
            }
          };
          strip.appendChild(tab);
        }

        el("tab-rail").classList.remove("hidden");
        updateArrows();
      }

      function applyFilter() {
        const q = el("search").value.trim().toLowerCase();
        const tokens = q ? q.split(/\s+/) : [];
        currentTokens = tokens;
        const matchIds = new Set(
          allIds.filter((id) => {
            const idx = sessionIndex[id] || "";
            return tokens.every((t) => idx.includes(t));
          }),
        );

        const strip = el("tab-strip");
        const children = Array.from(strip.children);
        for (let i = 0; i < children.length; i++) {
          const node = children[i];
          if (node.classList.contains("tab")) {
            const visible = matchIds.has(node.dataset.id);
            node.style.display = visible ? "" : "none";
          }
        }
        // Hide date separators with no visible tabs underneath
        for (let i = 0; i < children.length; i++) {
          const node = children[i];
          if (!node.classList.contains("tab-date")) continue;
          let anyVisible = false;
          for (let j = i + 1; j < children.length; j++) {
            const n = children[j];
            if (n.classList.contains("tab-date")) break;
            if (n.classList.contains("tab") && n.style.display !== "none") {
              anyVisible = true;
              break;
            }
          }
          node.style.display = anyVisible ? "" : "none";
        }

        const total = allIds.length;
        const shown = matchIds.size;
        el("status").textContent = q
          ? `${shown} of ${total} session${total === 1 ? "" : "s"}`
          : `${total} session${total === 1 ? "" : "s"}`;

        if (!shown) {
          activeId = null;
          el("tbl").classList.add("hidden");
          el("placeholder").classList.remove("hidden");
          el("placeholder-text").innerHTML = q
            ? PLACEHOLDER_NO_MATCH
            : PLACEHOLDER_DEFAULT;
        } else if (!activeId || !matchIds.has(activeId)) {
          const firstVisible = allIds.find((id) => matchIds.has(id));
          if (firstVisible) selectTab(firstVisible);
        } else {
          render(activeId);
        }
        updateArrows();
      }

      el("search").addEventListener("input", applyFilter);

      function selectTab(id) {
        if (activeId === id) return;
        activeId = id;

        // Update active class
        el("tab-strip")
          .querySelectorAll(".tab")
          .forEach((t) => {
            t.classList.toggle("active", t.dataset.id === id);
          });

        // Scroll active tab into view
        const activeEl = el("tab-strip").querySelector(".tab.active");
        if (activeEl)
          activeEl.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "nearest",
          });

        swapRender(id);
      }

      // ── Arrow scroll buttons ──────────────────────────────────────
      const strip = () => el("tab-strip");
      const SCROLL_STEP = 280;

      el("tab-prev").onclick = () =>
        strip().scrollBy({ left: -SCROLL_STEP, behavior: "smooth" });
      el("tab-next").onclick = () =>
        strip().scrollBy({ left: SCROLL_STEP, behavior: "smooth" });

      function updateArrows() {
        const s = strip();
        el("tab-prev").disabled = s.scrollLeft <= 0;
        el("tab-next").disabled =
          s.scrollLeft >= s.scrollWidth - s.clientWidth - 1;
      }

      // Mouse-wheel horizontal scroll on tab strip
      el("tab-strip")?.addEventListener(
        "wheel",
        (e) => {
          if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; // already horizontal
          e.preventDefault();
          strip().scrollBy({ left: e.deltaY * 1.2, behavior: "auto" });
        },
        { passive: false },
      );

      document.addEventListener("DOMContentLoaded", () => {
        const s = el("tab-strip");
        if (s) s.addEventListener("scroll", updateArrows, { passive: true });
      });

      // ── Render ────────────────────────────────────────────────────
      function swapRender(id) {
        if (document.startViewTransition)
          document.startViewTransition(() => render(id));
        else render(id);
      }

      function render(id) {
        const events = extract(sessions[id] || []);
        const frag = document.createDocumentFragment();
        const tpl = el("row-tpl");

        for (const ev of events) {
          const row = tpl.content.firstElementChild.cloneNode(true);
          row.querySelector(".time").textContent = ev.time;
          const badge = row.querySelector(".badge");
          badge.classList.add(ev.badgeCls);
          badge.textContent = ev.label;
          const cell = row.querySelector(".cell");
          if (ev.cellCls) cell.classList.add(ev.cellCls);
          cell.innerHTML = ev.html;
          if (currentTokens.length && highlightTokens(cell, currentTokens))
            row.classList.add("has-hl");
          frag.appendChild(row);
        }

        el("tbody").replaceChildren(frag);
        el("placeholder").classList.add("hidden");
        el("tbl").classList.remove("hidden");
        el("table-wrap").scrollTop = 0;
        updateMatchNav();
      }

      function updateMatchNav() {
        currentMatches = Array.from(el("tbody").querySelectorAll("tr.has-hl"));
        currentMatchIdx = currentMatches.length ? 0 : -1;
        for (const r of currentMatches) r.classList.remove("is-current-match");
        if (currentMatchIdx >= 0)
          currentMatches[0].classList.add("is-current-match");
        refreshMatchUI();
      }

      function refreshMatchUI() {
        const total = currentMatches.length;
        const enabled = total > 1;
        el("match-prev").disabled = !enabled;
        el("match-next").disabled = !enabled;
        el("match-count").textContent = total
          ? `${currentMatchIdx + 1}/${total}`
          : "";
      }

      function goToMatch(delta) {
        if (!currentMatches.length) return;
        currentMatches[currentMatchIdx]?.classList.remove("is-current-match");
        currentMatchIdx =
          (currentMatchIdx + delta + currentMatches.length) %
          currentMatches.length;
        const row = currentMatches[currentMatchIdx];
        row.classList.add("is-current-match");
        row.scrollIntoView({ block: "start", behavior: "smooth" });
        refreshMatchUI();
      }

      el("match-prev").onclick = () => goToMatch(-1);
      el("match-next").onclick = () => goToMatch(1);
      el("search").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          goToMatch(e.shiftKey ? -1 : 1);
        }
      });

      // ── Event extraction ──────────────────────────────────────────
      function extract(rows) {
        const events = [];
        for (const row of rows) {
          const ts = fmtTime(row.timestamp);
          if (row.type === "user" && row.toolUseResult)
            pushResult(events, ts, row);
          else if (row.type === "user" && !row.isMeta)
            pushUser(events, ts, row);
          else if (row.type === "assistant") pushAssistant(events, ts, row);
        }
        return events;
      }

      function pushUser(events, ts, row) {
        const content = row.message?.content;
        if (!content) return;
        const text =
          typeof content === "string"
            ? content
            : Array.isArray(content)
              ? content.map((c) => c.text || "").join("")
              : "";
        const clean = stripSystemTags(text);
        if (!clean.trim()) return;
        events.push({ time: ts, ...BADGE.user, html: esc(clean) });
      }

      function pushResult(events, ts, row) {
        const r = row.toolUseResult;
        let body = "";
        if (typeof r === "string") {
          body = renderValue(r);
        } else if (r.stdout !== undefined || r.stderr !== undefined) {
          const out = (r.stdout || "").trimEnd();
          const err = (r.stderr || "").trimEnd();
          if (out) body += `<div class="text-block">${esc(out)}</div>`;
          if (err)
            body += `<div class="text-block" style="color:#c07070">[stderr]\n${esc(err)}</div>`;
          if (!out && !err) return;
        } else if (Array.isArray(r.content)) {
          body = renderValue(r.content.map((c) => c.text || "").join(""));
        } else {
          body = jsonBlock(r);
        }
        if (!body) return;
        events.push({ time: ts, ...BADGE.result, html: collapsible(body, "") });
      }

      function pushAssistant(events, ts, row) {
        const content = row.message?.content;
        if (!Array.isArray(content)) return;
        for (const block of content) {
          if (block.type === "text" && block.text?.trim())
            events.push({
              time: ts,
              ...BADGE.assistant,
              html: marked.parse(block.text),
            });
          if (block.type === "tool_use") {
            const path = block.input?.file_path;
            const summary =
              `<span class="tool-name">${esc(block.name)}</span>` +
              (path ? `<span class="tool-path">${esc(path)}</span>` : "");
            const body = renderToolInput(block);
            events.push({
              time: ts,
              ...BADGE.tool,
              html: collapsible(body, summary),
            });
          }
        }
      }

      function renderToolInput(block) {
        const input = block.input || {};
        if (block.name === "Edit" && input.old_string && input.new_string)
          return renderDiff(input.old_string, input.new_string);
        if (block.name === "MultiEdit" && Array.isArray(input.edits))
          return input.edits
            .map((e) => renderDiff(e.old_string || "", e.new_string || ""))
            .join("");
        return jsonBlock(input);
      }

      function renderDiff(oldStr, newStr) {
        const parts = Diff.diffLines(oldStr, newStr);
        let html = '<div class="diff-block">';
        for (const part of parts) {
          const cls = part.added
            ? "diff-add"
            : part.removed
              ? "diff-rm"
              : "diff-ctx";
          const prefix = part.added ? "+" : part.removed ? "-" : " ";
          const lines = part.value.replace(/\n$/, "").split("\n");
          for (const line of lines)
            html += `<div class="diff-line ${cls}">${prefix} ${esc(line)}</div>`;
        }
        return html + "</div>";
      }

      function collapsible(body, summaryInner) {
        return `<details open><summary>${summaryInner}</summary>${body}</details>`;
      }

      function renderValue(s) {
        s = String(s ?? "").trim();
        if (!s) return "";
        if (s.startsWith("{") || s.startsWith("[")) {
          try {
            return jsonBlock(JSON.parse(s));
          } catch {}
        }
        return `<div class="text-block">${esc(s)}</div>`;
      }

      function jsonBlock(obj) {
        const extracted = [];
        function strip(val) {
          if (typeof val === "string" && val.includes("\n")) {
            extracted.push({ text: val });
            return "…";
          }
          if (Array.isArray(val)) return val.map(strip);
          if (val && typeof val === "object")
            return Object.fromEntries(
              Object.entries(val).map(([k, v]) => [k, strip(v)]),
            );
          return val;
        }
        const code = JSON.stringify(strip(obj), null, 2);
        const highlighted = hljs.highlight(code, { language: "json" }).value;
        const blocks = extracted
          .map((e) => `<div class="text-block">${esc(e.text)}</div>`)
          .join("");
        return `<div class="json-block"><pre><code class="hljs language-json">${highlighted}</code></pre></div>${blocks}`;
      }

      function stripSystemTags(s) {
        return s
          .replace(
            /<local-command-caveat>[\s\S]*?<\/local-command-caveat>/g,
            "",
          )
          .replace(/<command-name>[^<]*<\/command-name>/g, "")
          .replace(/<command-message>[^<]*<\/command-message>/g, "")
          .replace(/<command-args>([^<]*)<\/command-args>/g, "$1")
          .replace(/<[^>]+>/g, "")
          .trim();
      }

      function fmtTime(ts) {
        if (!ts) return "";
        return new Date(ts).toLocaleTimeString("en-GB", { hour12: false });
      }

      function escRe(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function highlightTokens(root, tokens) {
        if (!tokens.length) return false;
        const re = new RegExp(tokens.map(escRe).join("|"), "gi");
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        let n;
        while ((n = walker.nextNode())) nodes.push(n);
        let found = false;
        for (const node of nodes) {
          const text = node.nodeValue;
          re.lastIndex = 0;
          if (!re.test(text)) continue;
          re.lastIndex = 0;
          const frag = document.createDocumentFragment();
          let last = 0;
          let m;
          while ((m = re.exec(text))) {
            if (m.index > last)
              frag.appendChild(
                document.createTextNode(text.slice(last, m.index)),
              );
            const mark = document.createElement("mark");
            mark.className = "hl";
            mark.textContent = m[0];
            frag.appendChild(mark);
            last = m.index + m[0].length;
            if (m[0].length === 0) re.lastIndex++;
          }
          if (last < text.length)
            frag.appendChild(document.createTextNode(text.slice(last)));
          node.parentNode.replaceChild(frag, node);
          found = true;
        }
        return found;
      }

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
    </script>
  </body>
</html>
