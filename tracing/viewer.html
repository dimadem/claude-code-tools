<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trace Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    background: #0f0f0f;
    color: #d4d4d4;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    flex-shrink: 0;
  }

  /* Shared between button and select */
  :is(button, select) { color: #d4d4d4; border: 1px solid #3a3a3a; font-family: inherit; font-size: 12px; }
  button { background: #2a2a2a; padding: 5px 12px; cursor: pointer; &:hover { background: #333; } }
  select { background: #1a1a1a; padding: 5px 8px; max-width: 500px; }

  #status   { color: #555; font-size: 12px; }
  #table-wrap { flex: 1; overflow: auto; }
  table     { width: 100%; border-collapse: collapse; }

  thead th {
    position: sticky; top: 0;
    background: #161616;
    border-bottom: 1px solid #2a2a2a;
    padding: 7px 12px;
    text-align: left; color: #666; font-weight: normal; white-space: nowrap;
  }

  tbody {
    & tr {
      border-bottom: 1px solid #1a1a1a;
      content-visibility: auto;
      contain-intrinsic-size: auto 50px;
      &:hover { background: #141414; }
    }
    & td { padding: 7px 12px; vertical-align: top; }
  }

  .time { color: #555; white-space: nowrap; font-size: 11px; padding-top: 9px; }

  .badge {
    display: inline-block; padding: 2px 7px;
    font-size: 11px; white-space: nowrap; font-weight: 600; letter-spacing: 0.03em;
    &.b-user      { background: #0d2a45; color: #5fa8d3; }
    &.b-assistant { background: #1a2a1a; color: #6dba6d; }
    &.b-tool      { background: #2a2000; color: #d4a030; }
    &.b-result    { background: #1a1a2a; color: #8080c0; }
  }

  .cell        { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .cell-user   { color: #a8d0f0; }
  .cell-assist { color: #c8c8c8; }
  .tool-name   { color: #d4a030; font-weight: 600; }

  .json-block {
    margin-top: 4px; overflow-x: auto;
    & pre  { margin: 0; }
    & code { font-family: inherit; font-size: 12px; }
  }

  .text-block { background: #141414; border: 1px solid #222; padding: 8px 12px; margin-top: 4px; color: #9090b8; }

  details > summary {
    cursor: pointer; list-style: none; user-select: none; padding: 2px 0; color: #555;
    &::-webkit-details-marker { display: none; }
    &::before { content: '▾'; display: inline-block; width: 14px; transition: transform 0.15s; }
  }
  details:not([open]) > summary::before { transform: rotate(-90deg); }

  #placeholder { display: grid; place-items: center; height: 100%; color: #333; font-size: 14px; }
  .hidden      { display: none !important; }

  body.dragover {
    outline: 2px dashed #5fa8d3; outline-offset: -8px;
    & #placeholder { color: #5fa8d3; }
  }

  /* View-transition tuning for session swap */
  ::view-transition-old(tbody), ::view-transition-new(tbody) { animation-duration: 0.18s; }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-open">Open tracing folder</button>
  <select id="sel" class="hidden"></select>
  <span id="status">No folder selected</span>
</div>

<div id="table-wrap">
  <div id="placeholder">Click "Open tracing folder" and select the tracing/ directory</div>
  <table id="tbl" class="hidden">
    <thead>
      <tr>
        <th style="width:70px">Time</th>
        <th style="width:90px">Type</th>
        <th>Content</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<template id="row-tpl">
  <tr>
    <td class="time"></td>
    <td><span class="badge"></span></td>
    <td class="cell"></td>
  </tr>
</template>

<script>
const sessions = {};

const els = {
  status:      document.getElementById('status'),
  sel:         document.getElementById('sel'),
  tbody:       document.getElementById('tbody'),
  tbl:         document.getElementById('tbl'),
  placeholder: document.getElementById('placeholder'),
  rowTpl:      document.getElementById('row-tpl'),
};

const BADGE = {
  user:      { label: 'USER',      badgeCls: 'b-user',      cellCls: 'cell-user'  },
  assistant: { label: 'ASSISTANT', badgeCls: 'b-assistant', cellCls: 'cell-assist' },
  tool:      { label: 'TOOL CALL', badgeCls: 'b-tool',      cellCls: ''           },
  result:    { label: 'RESULT',    badgeCls: 'b-result',    cellCls: ''           },
};

document.getElementById('btn-open').onclick = async () => {
  try {
    const dir = await window.showDirectoryPicker({ mode: 'read' });
    await loadDir(dir);
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
};

els.sel.onchange = e => swapRender(e.target.value);

// Drag & drop a folder anywhere on the page.
document.addEventListener('dragover', e => {
  e.preventDefault();
  document.body.classList.add('dragover');
});
document.addEventListener('dragleave', e => {
  if (e.target === document.documentElement) document.body.classList.remove('dragover');
});
document.addEventListener('drop', async e => {
  e.preventDefault();
  document.body.classList.remove('dragover');
  for (const item of e.dataTransfer.items) {
    const handle = await item.getAsFileSystemHandle?.();
    if (handle?.kind === 'directory') { await loadDir(handle); return; }
  }
});

// Wrap render in a View Transition for a smooth swap; falls back if unsupported.
function swapRender(id) {
  if (document.startViewTransition) document.startViewTransition(() => render(id));
  else render(id);
}

function sessionTs(id) {
  const first = sessions[id].find(r => r.timestamp);
  return first ? new Date(first.timestamp).getTime() : 0;
}

async function loadDir(dir) {
  els.status.textContent = 'Loading…';

  const handles = [];
  for await (const [name, handle] of dir) {
    if (handle.kind === 'file' && name.endsWith('.jsonl')) handles.push([name, handle]);
  }

  await Promise.all(handles.map(async ([name, handle]) => {
    const text = await (await handle.getFile()).text();
    sessions[name.replace(/\.jsonl$/, '')] = text.trim().split('\n').flatMap(l => {
      try { return [JSON.parse(l)]; } catch { return []; }
    });
  }));

  const ids = Object.keys(sessions).sort((a, b) => sessionTs(b) - sessionTs(a));
  if (!ids.length) { els.status.textContent = 'No .jsonl files found'; return; }

  els.sel.innerHTML = ids.map(id => {
    const ts = sessionTs(id);
    const label = ts ? new Date(ts).toLocaleString() : id;
    return `<option value="${id}">${label} — ${id.slice(0, 8)}</option>`;
  }).join('');
  els.sel.classList.remove('hidden');
  els.status.textContent = `${ids.length} session(s)`;
  swapRender(ids[0]);
}

function render(id) {
  const events = extract(sessions[id] || []);
  const frag = document.createDocumentFragment();

  for (const ev of events) {
    const row = els.rowTpl.content.firstElementChild.cloneNode(true);
    row.querySelector('.time').textContent = ev.time;
    const badge = row.querySelector('.badge');
    badge.classList.add(ev.badgeCls);
    badge.textContent = ev.label;
    const cell = row.querySelector('.cell');
    if (ev.cellCls) cell.classList.add(ev.cellCls);
    cell.innerHTML = ev.html;
    frag.appendChild(row);
  }

  els.tbody.replaceChildren(frag);
  els.placeholder.classList.add('hidden');
  els.tbl.classList.remove('hidden');
}

function extract(rows) {
  const events = [];
  for (const row of rows) {
    const ts = fmtTime(row.timestamp);
    if (row.type === 'user' && row.toolUseResult)
      pushResult(events, ts, row);
    else if (row.type === 'user' && !row.isMeta && !row.attachment)
      pushUser(events, ts, row);
    else if (row.type === 'assistant')
      pushAssistant(events, ts, row);
  }
  return events;
}

function pushUser(events, ts, row) {
  const content = row.message?.content;
  if (!content) return;
  const text = typeof content === 'string' ? content
    : Array.isArray(content) ? content.map(c => c.text || '').join('') : '';
  const clean = stripSystemTags(text);
  if (!clean.trim()) return;
  events.push({ time: ts, ...BADGE.user, html: esc(clean) });
}

function pushResult(events, ts, row) {
  const r = row.toolUseResult;
  let body = '';
  if (typeof r === 'string') {
    body = renderValue(r);
  } else if (r.stdout !== undefined || r.stderr !== undefined) {
    const out = (r.stdout || '').trimEnd();
    const err = (r.stderr || '').trimEnd();
    if (out) body += `<div class="text-block">${esc(out)}</div>`;
    if (err) body += `<div class="text-block" style="color:#c07070">[stderr]\n${esc(err)}</div>`;
    if (!out && !err) return;
  } else if (Array.isArray(r.content)) {
    body = renderValue(r.content.map(c => c.text || '').join(''));
  } else {
    body = jsonBlock(r);
  }
  if (!body) return;
  events.push({ time: ts, ...BADGE.result, html: collapsible(body, '') });
}

function pushAssistant(events, ts, row) {
  const content = row.message?.content;
  if (!Array.isArray(content)) return;
  for (const block of content) {
    if (block.type === 'text' && block.text?.trim()) {
      events.push({ time: ts, ...BADGE.assistant, html: esc(block.text) });
    }
    if (block.type === 'tool_use') {
      const summary = `<span class="tool-name">${esc(block.name)}</span>`;
      events.push({ time: ts, ...BADGE.tool, html: collapsible(jsonBlock(block.input), summary) });
    }
  }
}

// Wrap heavy content in <details open> so the user can click to collapse.
function collapsible(body, summaryInner) {
  return `<details open><summary>${summaryInner}</summary>${body}</details>`;
}

// Render a value: if it looks like JSON, pretty-print it; otherwise plain text block
function renderValue(s) {
  s = String(s ?? '').trim();
  if (!s) return '';
  if (s.startsWith('{') || s.startsWith('[')) {
    try { return jsonBlock(JSON.parse(s)); } catch {}
  }
  return `<div class="text-block">${esc(s)}</div>`;
}

function jsonBlock(obj) {
  const extracted = [];

  function strip(val) {
    if (typeof val === 'string' && val.includes('\n')) {
      extracted.push({ text: val });
      return '…';
    }
    if (Array.isArray(val)) return val.map(strip);
    if (val && typeof val === 'object') {
      return Object.fromEntries(Object.entries(val).map(([k, v]) => [k, strip(v)]));
    }
    return val;
  }

  const stripped = strip(obj);
  const code = JSON.stringify(stripped, null, 2);
  const highlighted = hljs.highlight(code, { language: 'json' }).value;

  const blocks = extracted.map(e =>
    `<div class="text-block">${esc(e.text)}</div>`
  ).join('');

  return `<div class="json-block"><pre><code class="hljs language-json">${highlighted}</code></pre></div>${blocks}`;
}

// First three replacements remove system wrapper tags AND their content.
// The final replacement strips any remaining tags while preserving inner text.
function stripSystemTags(s) {
  return s
    .replace(/<local-command-caveat>[\s\S]*?<\/local-command-caveat>/g, '')
    .replace(/<command-name>[^<]*<\/command-name>/g, '')
    .replace(/<command-message>[^<]*<\/command-message>/g, '')
    .replace(/<command-args>([^<]*)<\/command-args>/g, '$1')
    .replace(/<[^>]+>/g, '')
    .trim();
}

function fmtTime(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString('en-GB', { hour12: false });
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
